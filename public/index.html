<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClipSync - 跨设备剪贴板</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --msg-own: #eef2ff;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
html { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  overscroll-behavior: none;
}
.container {
  width: 100%;
  max-width: 800px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  box-shadow: var(--shadow);
}
header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.3px;
}
header p {
  font-size: 13px;
  color: var(--text-secondary);
}

.ip-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 16px;
  background: #fef3c7;
  border-bottom: 1px solid #fbbf24;
  font-size: 13px;
  flex-shrink: 0;
}
.ip-banner-text { flex: 1; line-height: 1.5; }
.ip-banner-text strong { font-size: 14px; }
.ip-banner-close {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: #92400e;
  padding: 2px 6px;
  border-radius: 4px;
}
.ip-banner-close:hover { background: rgba(0,0,0,0.06); }

.main-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.qr-sidebar {
  width: 200px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px 16px;
  border-right: 1px solid var(--border);
  gap: 10px;
}
.qr-sidebar #qrcode {
  padding: 12px;
  background: white;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.qr-sidebar #qrcode img { display: block; }
.qr-sidebar .qr-label {
  font-size: 13px;
  color: var(--text-secondary);
  text-align: center;
  line-height: 1.4;
}

.connection-status {
  text-align: center;
  padding: 6px 16px;
  font-size: 12px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.connection-status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
.connection-status .dot.green { background: #22c55e; }
.connection-status .dot.red { background: #ef4444; }
.device-count { color: var(--text-secondary); }

.messages-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.messages:empty::after {
  content: '暂无消息，发送文本开始同步';
  display: block;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
  padding: 40px 0;
}
.msg {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg.own { align-self: flex-end; }
.msg.other { align-self: flex-start; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-all;
  white-space: pre-wrap;
}
.msg.own .msg-bubble {
  background: var(--msg-own);
  border: 1px solid #c7d2fe;
  border-bottom-right-radius: 4px;
}
.msg.other .msg-bubble {
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg-device {
  font-size: 11px;
  color: var(--text-secondary);
  margin: 0 4px 2px;
}
.msg.own .msg-device { text-align: right; }
.msg-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 4px;
}
.msg-time {
  font-size: 11px;
  color: var(--text-secondary);
}
.btn-copy {
  font-size: 11px;
  color: var(--primary);
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-copy:hover { background: var(--msg-own); border-color: var(--primary); }
.btn-copy.copied { background: #22c55e; color: white; border-color: #22c55e; }

.input-area {
  flex-shrink: 0;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  background: var(--card);
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-row textarea {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 42px;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}
.input-row textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }
.btn-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  font-size: 18px;
  color: var(--text-secondary);
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); background: var(--msg-own); }
.btn-icon:active { transform: scale(0.95); }
.btn-send {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.btn-send:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }

.shortcuts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.shortcut-btn {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s;
}
.shortcut-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--msg-own); }

.qr-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.45);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.qr-modal-overlay.open { display: flex; }
.qr-modal {
  background: var(--card);
  border-radius: 16px;
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
.qr-modal #qrcode-modal {
  padding: 12px;
  background: white;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.qr-modal #qrcode-modal img { display: block; }
.qr-modal .qr-label {
  font-size: 13px;
  color: var(--text-secondary);
  text-align: center;
}
.qr-modal-close {
  margin-top: 4px;
  font-size: 14px;
  color: var(--primary);
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 24px;
  cursor: pointer;
  transition: all 0.2s;
}
.qr-modal-close:hover { background: var(--msg-own); border-color: var(--primary); }

@media (max-width: 640px) {
  .container { max-width: 100%; }
  header { padding: 16px 16px 12px; }
  header h1 { font-size: 18px; }
  .messages { padding: 12px 12px 4px; }
  .input-area { padding: 8px 12px 12px; }
  .msg { max-width: 90%; }
}
</style>
</head>
<body>
<div class="container" id="app">
  <header>
    <h1>ClipSync</h1>
    <p>跨设备剪贴板同步</p>
  </header>

  <div class="ip-banner" id="ipBanner" style="display:none">
    <div class="ip-banner-text">
      请在其他设备打开<br>
      <strong id="ipDisplay"></strong>
    </div>
    <button class="ip-banner-close" id="ipClose">✕</button>
  </div>

  <div class="connection-status" id="status">
    <span><span class="dot red" id="statusDot"></span><span id="statusText">正在连接...</span></span>
    <span class="device-count" id="deviceCount"></span>
  </div>

  <div class="main-area">
    <div class="qr-sidebar" id="qrSidebar">
      <div id="qrcode"></div>
      <div class="qr-label" id="qrLabel">扫描二维码连接此页面</div>
    </div>
    <div class="messages-area">
      <div class="messages" id="messages"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="输入或粘贴文本..." maxlength="50000"></textarea>
      <button class="btn-icon" id="btnQrMobile" title="二维码">📱</button>
      <button class="btn-icon btn-send" id="btnSend" title="发送">➤</button>
    </div>
    <div class="shortcuts" id="shortcuts"></div>
  </div>
</div>

<div class="qr-modal-overlay" id="qrModalOverlay">
  <div class="qr-modal">
    <div id="qrcode-modal"></div>
    <div class="qr-label" id="qrModalLabel"></div>
    <button class="qr-modal-close" id="qrModalClose">关闭</button>
  </div>
</div>

<script>
(function () {
  var LAN_IP = '__LAN_IP__';
  var PORT = '__PORT__';
  var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  var accessHost = isLocalhost ? (LAN_IP + ':' + PORT) : window.location.host;
  var accessUrl = window.location.protocol + '//' + accessHost;
  var targetUrl = accessUrl + '/dd';

  var isMobile = window.location.pathname === '/dd';
  var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  var wsUrl = protocol + '//' + accessHost;

  var ws = null;
  var deviceId = '';

  var defaultShortcuts = [
    '验证码', '密码', '邮箱', '手机号',
    'https://', 'http://', '---分隔线---', '=====',
  ];

  function init() {
    fixViewportHeight();
    deviceId = generateId();

    if (isLocalhost) {
      var banner = document.getElementById('ipBanner');
      var display = document.getElementById('ipDisplay');
      var closeBtn = document.getElementById('ipClose');
      display.textContent = accessUrl;
      banner.style.display = 'flex';
      closeBtn.addEventListener('click', function () { banner.style.display = 'none'; });
    }

    setupQR();
    connectWS();
    setupInput();
    setupShortcuts();
    autoResizeTextarea();
  }

  function fixViewportHeight() {
    var container = document.getElementById('app');
    function update() {
      var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      container.style.height = h + 'px';
    }
    update();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        update();
        var msgs = document.getElementById('messages');
        msgs.scrollTop = msgs.scrollHeight;
      });
    } else {
      window.addEventListener('resize', function () {
        update();
        var msgs = document.getElementById('messages');
        msgs.scrollTop = msgs.scrollHeight;
      });
    }
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function setupQR() {
    var sidebar = document.getElementById('qrSidebar');
    var btnQr = document.getElementById('btnQrMobile');
    var overlay = document.getElementById('qrModalOverlay');
    var closeBtn = document.getElementById('qrModalClose');
    var modalLabel = document.getElementById('qrModalLabel');
    var qrModalContainer = document.getElementById('qrcode-modal');
    var qrGenerated = false;

    if (isMobile) {
      sidebar.style.display = 'none';
      btnQr.style.display = 'flex';
      btnQr.addEventListener('click', function () {
        overlay.classList.add('open');
        if (!qrGenerated) {
          new QRCode(qrModalContainer, { text: targetUrl, width: 180, height: 180 });
          qrGenerated = true;
        }
      });
      function closeModal() { overlay.classList.remove('open'); }
      closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
      });
      modalLabel.textContent = '扫描二维码连接此页面';
    } else {
      btnQr.style.display = 'none';
      new QRCode(document.getElementById('qrcode'), { text: targetUrl, width: 160, height: 160 });
    }
  }

  function connectWS() {
    ws = new WebSocket(wsUrl);

    ws.onopen = function () {
      document.getElementById('statusText').textContent = '已连接';
      document.getElementById('statusDot').className = 'dot green';
    };

    ws.onclose = function () {
      document.getElementById('statusText').textContent = '连接断开，正在重连...';
      document.getElementById('statusDot').className = 'dot red';
      document.getElementById('deviceCount').textContent = '';
      document.getElementById('messages').innerHTML = '';
      setTimeout(connectWS, 2000);
    };

    ws.onerror = function () {
      document.getElementById('statusText').textContent = '连接错误，正在重连...';
      document.getElementById('statusDot').className = 'dot red';
    };

    ws.onmessage = function (e) {
      try {
        var data = JSON.parse(e.data);
        if (data.type === 'count') {
          var el = document.getElementById('deviceCount');
          el.textContent = '共有 ' + data.count + ' 台设备';
          return;
        }
        if (data.type === 'sync') {
          var msgs = document.getElementById('messages');
          msgs.innerHTML = '';
          data.messages.forEach(function (m) {
            addMessage(m.text, m.deviceId, m.time, m.deviceId === deviceId);
          });
          return;
        }
        addMessage(data.text, data.deviceId, data.time, data.deviceId === deviceId);
      } catch {
        addMessage(e.data, '', Date.now(), false);
      }
    };
  }

  function addMessage(text, senderId, time, isOwn) {
    var messagesEl = document.getElementById('messages');
    var div = document.createElement('div');
    div.className = 'msg ' + (isOwn ? 'own' : 'other');

    var deviceLabel = document.createElement('div');
    deviceLabel.className = 'msg-device';
    deviceLabel.textContent = isOwn ? '我' : '其他设备';
    div.appendChild(deviceLabel);

    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    div.appendChild(bubble);

    var footer = document.createElement('div');
    footer.className = 'msg-footer';

    var timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTime(time || Date.now());
    footer.appendChild(timeEl);

    var copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = '复制';
    copyBtn.addEventListener('click', function () {
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = '复制';
          copyBtn.classList.remove('copied');
        }, 1500);
      }).catch(function () {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = '复制';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });
    footer.appendChild(copyBtn);

    div.appendChild(footer);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function formatTime(t) {
    var d = new Date(t);
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  function sendMessage() {
    var inputEl = document.getElementById('input');
    var text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;

    var msg = { text: text, deviceId: deviceId, time: Date.now() };
    ws.send(JSON.stringify(msg));
    inputEl.value = '';
    autoResizeTextarea();
  }

  function setupInput() {
    var inputEl = document.getElementById('input');
    document.getElementById('btnSend').addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', autoResizeTextarea);


  }

  function autoResizeTextarea() {
    var el = document.getElementById('input');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function setupShortcuts() {
    var el = document.getElementById('shortcuts');
    var saved = localStorage.getItem('clipsync_shortcuts');
    var items = saved ? JSON.parse(saved) : defaultShortcuts;

    items.forEach(function (text) {
      var btn = document.createElement('button');
      btn.className = 'shortcut-btn';
      btn.textContent = text;
      btn.addEventListener('click', function () {
        var inputEl = document.getElementById('input');
        if (text === '---分隔线---') { inputEl.value += '\n---\n'; }
        else if (text === '=====') { inputEl.value += '\n=====\n'; }
        else { inputEl.value += text; }
        autoResizeTextarea();
        inputEl.focus();
      });
      el.appendChild(btn);
    });
  }

  init();
})();
</script>
</body>
</html>
