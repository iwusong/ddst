<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ClipSync - 跨设备剪贴板</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --msg-own: #eef2ff;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 600px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  box-shadow: var(--shadow);
}
header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  flex-shrink: 0;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.3px;
}
header p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.ip-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 16px;
  background: #fef3c7;
  border-bottom: 1px solid #fbbf24;
  font-size: 13px;
  flex-shrink: 0;
}
.ip-banner-text { flex: 1; line-height: 1.5; }
.ip-banner-text strong { font-size: 14px; }
.ip-br { display: none; }
.ip-banner-close {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: #92400e;
  padding: 2px 6px;
  border-radius: 4px;
}
.ip-banner-close:hover { background: rgba(0,0,0,0.06); }

.qr-section {
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.qr-section.hidden { display: none; }
#qrcode {
  padding: 12px;
  background: white;
  border-radius: 12px;
  box-shadow: var(--shadow);
}
#qrcode img { display: block; }
.qr-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 8px;
}
.qr-toggle {
  margin-top: 8px;
  font-size: 13px;
  color: var(--primary);
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.qr-toggle:hover { background: var(--msg-own); border-color: var(--primary); }

.connection-status {
  text-align: center;
  padding: 6px;
  font-size: 12px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.connection-status.connected { color: #22c55e; }
.connection-status.disconnected { color: #ef4444; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.messages:empty::after {
  content: '暂无消息，发送文本开始同步';
  display: block;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
  padding: 40px 0;
}
.msg {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg.own { align-self: flex-end; }
.msg.other { align-self: flex-start; }
.msg-bubble {
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-all;
  white-space: pre-wrap;
  position: relative;
}
.msg.own .msg-bubble {
  background: var(--msg-own);
  border: 1px solid #c7d2fe;
  border-bottom-right-radius: 4px;
}
.msg.other .msg-bubble {
  background: #f1f5f9;
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.msg-device {
  font-size: 11px;
  color: var(--text-secondary);
  margin: 0 4px 2px;
}
.msg.own .msg-device { text-align: right; }
.msg-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 4px;
}
.msg-time {
  font-size: 11px;
  color: var(--text-secondary);
}
.btn-copy {
  font-size: 11px;
  color: var(--primary);
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-copy:hover { background: var(--msg-own); border-color: var(--primary); }
.btn-copy.copied { background: #22c55e; color: white; border-color: #22c55e; }

.input-area {
  flex-shrink: 0;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  background: var(--card);
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-row textarea {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 42px;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color 0.2s;
}
.input-row textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }
.btn-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  font-size: 18px;
  color: var(--text-secondary);
}
.btn-icon:hover { border-color: var(--primary); color: var(--primary); background: var(--msg-own); }
.btn-icon:active { transform: scale(0.95); }
.btn-send {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.btn-send:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: white; }

.shortcuts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.shortcut-btn {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.15s;
}
.shortcut-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--msg-own); }

@media (max-width: 480px) {
  header { padding: 16px 16px 12px; }
  header h1 { font-size: 18px; }
  .messages { padding: 12px 12px 4px; }
  .input-area { padding: 8px 12px 12px; }
  .msg { max-width: 90%; }
}
</style>
</head>
<body>
<div class="container" id="app">
  <header>
    <h1>ClipSync</h1>
    <p>跨设备剪贴板同步</p>
  </header>

  <div class="qr-section" id="qrSection">
    <div id="qrcode"></div>
    <div class="qr-label" id="qrLabel"></div>
    <button class="qr-toggle" id="qrToggle"></button>
  </div>

  <div class="connection-status disconnected" id="status">正在连接...</div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="输入或粘贴文本..." maxlength="50000"></textarea>
      <button class="btn-icon" id="btnPaste" title="粘贴">📋</button>
      <button class="btn-icon btn-send" id="btnSend" title="发送">➤</button>
    </div>
    <div class="shortcuts" id="shortcuts"></div>
  </div>
</div>

<div class="ip-banner" id="ipBanner" style="display:none">
  <div class="ip-banner-text">
    请在其他设备打开<br class="ip-br">
    <strong id="ipDisplay"></strong>
  </div>
  <button class="ip-banner-close" id="ipClose">✕</button>
</div>

<script>
(function () {
  var LAN_IP = '__LAN_IP__';
  var PORT = '__PORT__';
  var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  var accessHost = isLocalhost ? (LAN_IP + ':' + PORT) : window.location.host;
  var accessUrl = window.location.protocol + '//' + accessHost;
  var targetUrl = accessUrl + '/dd';

  var isMobile = window.location.pathname === '/dd';
  var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  var wsUrl = protocol + '//' + accessHost;

  var qrSection = document.getElementById('qrSection');
  var qrContainer = document.getElementById('qrcode');
  var qrLabel = document.getElementById('qrLabel');
  var qrToggle = document.getElementById('qrToggle');
  var statusEl = document.getElementById('status');
  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('input');
  var btnSend = document.getElementById('btnSend');
  var btnPaste = document.getElementById('btnPaste');
  var shortcutsEl = document.getElementById('shortcuts');
  var ipBanner = document.getElementById('ipBanner');
  var ipDisplay = document.getElementById('ipDisplay');
  var ipClose = document.getElementById('ipClose');

  var deviceId = '';

  var defaultShortcuts = [
    '验证码', '密码', '邮箱', '手机号',
    'https://', 'http://', '---分隔线---', '=====',
  ];

  function init() {
    deviceId = generateId();

    if (isLocalhost) {
      ipDisplay.textContent = accessUrl;
      ipBanner.style.display = 'flex';
      ipClose.addEventListener('click', function () { ipBanner.style.display = 'none'; });
    }

    setupQR();
    connectWS();
    setupInput();
    setupShortcuts();
    autoResizeTextarea();
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function setupQR() {
    if (isMobile) {
      qrSection.classList.add('hidden');
      qrToggle.textContent = '显示二维码';
      qrToggle.addEventListener('click', function () {
        var hidden = qrSection.classList.toggle('hidden');
        qrToggle.textContent = hidden ? '显示二维码' : '隐藏二维码';
        if (!hidden && !qrContainer.hasChildNodes()) {
          new QRCode(qrContainer, { text: targetUrl, width: 160, height: 160 });
        }
      });
    } else {
      qrToggle.style.display = 'none';
      qrLabel.textContent = '扫描二维码连接此页面';
      new QRCode(qrContainer, { text: targetUrl, width: 180, height: 180 });
    }
  }

  let ws = null;

  function connectWS() {
    ws = new WebSocket(wsUrl);

    ws.onopen = function () {
      statusEl.textContent = '已连接';
      statusEl.className = 'connection-status connected';
    };

    ws.onclose = function () {
      statusEl.textContent = '连接断开，正在重连...';
      statusEl.className = 'connection-status disconnected';
      setTimeout(connectWS, 2000);
    };

    ws.onerror = function () {
      statusEl.textContent = '连接错误，正在重连...';
      statusEl.className = 'connection-status disconnected';
    };

    ws.onmessage = function (e) {
      try {
        const data = JSON.parse(e.data);
        var isOwn = data.deviceId === deviceId;
        addMessage(data.text, data.deviceId, data.time, isOwn);
      } catch {
        addMessage(e.data, '', Date.now(), false);
      }
    };
  }

  function addMessage(text, senderId, time, isOwn) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isOwn ? 'own' : 'other');

    const deviceLabel = document.createElement('div');
    deviceLabel.className = 'msg-device';
    if (isOwn) {
      deviceLabel.textContent = '我';
    } else {
      deviceLabel.textContent = '其他设备';
    }
    div.appendChild(deviceLabel);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    div.appendChild(bubble);

    const footer = document.createElement('div');
    footer.className = 'msg-footer';

    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTime(time || Date.now());
    footer.appendChild(timeEl);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = '复制';
    copyBtn.addEventListener('click', function () {
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = '复制';
          copyBtn.classList.remove('copied');
        }, 1500);
      }).catch(function () {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('copied');
        setTimeout(function () {
          copyBtn.textContent = '复制';
          copyBtn.classList.remove('copied');
        }, 1500);
      });
    });
    footer.appendChild(copyBtn);

    div.appendChild(footer);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function formatTime(t) {
    const d = new Date(t);
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;

    const msg = { text: text, deviceId: deviceId, time: Date.now() };
    ws.send(JSON.stringify(msg));
    inputEl.value = '';
    autoResizeTextarea();
  }

  function setupInput() {
    btnSend.addEventListener('click', sendMessage);

    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener('input', autoResizeTextarea);

    btnPaste.addEventListener('click', async function () {
      try {
        const text = await navigator.clipboard.readText();
        const start = inputEl.selectionStart;
        const end = inputEl.selectionEnd;
        const before = inputEl.value.substring(0, start);
        const after = inputEl.value.substring(end);
        inputEl.value = before + text + after;
        inputEl.selectionStart = inputEl.selectionEnd = start + text.length;
        autoResizeTextarea();
        inputEl.focus();
      } catch {
        inputEl.focus();
        document.execCommand('paste');
      }
    });
  }

  function autoResizeTextarea() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  function setupShortcuts() {
    const saved = localStorage.getItem('clipsync_shortcuts');
    const items = saved ? JSON.parse(saved) : defaultShortcuts;

    items.forEach(function (text) {
      const btn = document.createElement('button');
      btn.className = 'shortcut-btn';
      btn.textContent = text;
      btn.addEventListener('click', function () {
        if (text === '---分隔线---') { inputEl.value += '\n---\n'; }
        else if (text === '=====') { inputEl.value += '\n=====\n'; }
        else { inputEl.value += text; }
        autoResizeTextarea();
        inputEl.focus();
      });
      shortcutsEl.appendChild(btn);
    });
  }

  init();
})();
</script>
</body>
</html>
